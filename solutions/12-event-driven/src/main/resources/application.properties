# HTTP configuration
quarkus.http.port=8080

# Application name
quarkus.application.name=incident-management

# Logging configuration
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.console.level=INFO
quarkus.log.category."com.incidentmanagement".level=INFO
quarkus.langchain4j.log-requests=false
quarkus.langchain4j.log-responses=false
# Development mode log level
%dev.quarkus.log.console.level=INFO
%dev.quarkus.log.category."com.incidentmanagement".level=DEBUG
%dev.quarkus.log.category."dev.langchain4j.agentic".level=DEBUG
%dev.quarkus.log.category."dev.langchain4j.agentic.supervisor".level=DEBUG
# The current AgentMonitor emits false listener errors for parallel mapper callbacks.
%dev.quarkus.log.category."dev.langchain4j.agentic.observability.ListenerNotifierUtil".level=OFF

# port to expose in development mode
%dev.quarkus.http.port=8080

# Disable banner in console
quarkus.banner.enabled=false

# Static resources configuration
quarkus.http.static-resources.caching-enabled=false

# AI model configuration
quarkus.langchain4j.chat-model.provider=openai
quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY}
quarkus.langchain4j.openai.chat-model.model-name=gpt-4o
quarkus.langchain4j.openai.chat-model.temperature=0
quarkus.langchain4j.openai.timeout=PT180S

# ---------------------------------------------------------------------------
# Kafka / SmallRye Reactive Messaging
# The broker is started automatically by Kafka Dev Services (Redpanda) in dev
# and test — no bootstrap.servers to configure. Serializers/deserializers for
# the record payloads are detected automatically from the channel signatures.
# ---------------------------------------------------------------------------

# Producer side: REST/dashboard -> incidents-in topic
mp.messaging.outgoing.incidents-out.connector=smallrye-kafka
mp.messaging.outgoing.incidents-out.topic=incidents-in

# Pipeline input: incidents-in topic -> agentic consumer
mp.messaging.incoming.incidents-in.connector=smallrye-kafka
mp.messaging.incoming.incidents-in.topic=incidents-in
mp.messaging.incoming.incidents-in.auto.offset.reset=earliest

# Pipeline output: agentic consumer -> resolutions-out topic
mp.messaging.outgoing.resolutions-out.connector=smallrye-kafka
mp.messaging.outgoing.resolutions-out.topic=resolutions-out

# Downstream sink: resolutions-out topic -> ResolutionSink
mp.messaging.incoming.resolutions-in.connector=smallrye-kafka
mp.messaging.incoming.resolutions-in.topic=resolutions-out
mp.messaging.incoming.resolutions-in.auto.offset.reset=earliest
