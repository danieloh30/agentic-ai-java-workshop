quarkus.application.name=apex-part3
quarkus.http.port=8080
quarkus.banner.enabled=false
quarkus.http.static-resources.caching-enabled=false
quarkus.langchain4j.chat-model.provider=openai
quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY}
quarkus.langchain4j.openai.chat-model.model-name=gpt-4o
quarkus.langchain4j.openai.chat-model.temperature=0
quarkus.langchain4j.openai.timeout=PT60S
quarkus.langchain4j.log-requests=false
quarkus.langchain4j.log-responses=false
quarkus.langchain4j.skills.directories=classpath:skills
%dev.quarkus.live-reload.watched-resources=skills/incident-response/SKILL.md,evaluation/cases.json
quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.sql-load-script=no-file
%dev.quarkus.datasource.devservices.enabled=false
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:${PART3_DB_PORT:55435}/apex
%dev.quarkus.datasource.username=workshop
%dev.quarkus.datasource.password=workshop
%dev.quarkus.hibernate-orm.schema-management.strategy=update
%test.quarkus.scheduler.enabled=false
%test.quarkus.datasource.devservices.reuse=false
# The supplied worker reclassifies abandoned planning attempts after this lease.
workshop.planning-lease-seconds=120
