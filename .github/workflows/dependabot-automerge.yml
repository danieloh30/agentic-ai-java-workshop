name: Dependabot auto-merge

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Approve Dependabot PR
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for Quarkus / extension / Actions updates
        # Automerge Quarkus platform, Quarkiverse, LangChain4j, MCP, A2A bumps, and GitHub Actions
        if: |
          contains(steps.metadata.outputs.dependency-names, 'quarkus') ||
          contains(steps.metadata.outputs.dependency-names, 'langchain4j') ||
          contains(steps.metadata.outputs.dependency-names, 'mcp') ||
          contains(steps.metadata.outputs.dependency-names, 'a2a') ||
          steps.metadata.outputs.package-ecosystem == 'github_actions'
        run: gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
