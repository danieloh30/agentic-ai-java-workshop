  # ── exercise 07 — remote A2A agent ────────────────────────────────────────
  - package-ecosystem: maven
    directory: /solutions/07-a2a/remote-a2a-agent
    schedule:
      interval: daily
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - java
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # a2a.version is pinned to 1.1.0.Final to match the version pulled
      # transitively by langchain4j-agentic-a2a on the client. Newer versions
      # (1.2.x/1.3.x) change streaming/task semantics and cause TaskNotFoundError.
      # Keep Dependabot from bumping it and re-introducing the mismatch.
      - dependency-name: "org.a2aproject.sdk:*"
    groups:
      quarkus-platform:
        patterns:
          - "io.quarkus*"
          - "io.quarkus.platform*"
      quarkus-langchain4j:
        patterns:
          - "io.quarkiverse.langchain4j*"

