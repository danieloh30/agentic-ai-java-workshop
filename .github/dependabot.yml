version: 2

updates:
  # ── lab project (the main working copy attendees edit) ─────────────────────
  - package-ecosystem: maven
    directory: /lab
    schedule:
      interval: daily
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - java
    commit-message:
      prefix: "chore(deps)"
    groups:
      quarkus-platform:
        patterns:
          - "io.quarkus*"
          - "io.quarkus.platform*"
      quarkus-langchain4j:
        patterns:
          - "io.quarkiverse.langchain4j*"

